[project]
name = "brownsea"
version = "0.1.0"
description = ""
authors = [{ name = "Dan Trickey", email = "git@trickey.io" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "wagtail>=7.4,<7.5",
    "crispy-bootstrap5>=2026.3",
    "django-crispy-forms>=2.7",
    "dj-database-url>=3.1.2",
    "django-environ>=0.14.0",
    "django-vite>=3.1.0",
    "whitenoise>=6.12.0",
    "authlib>=1.7.2",
    "sentry-sdk[django]>=2.66.1",
    "httpx>=0.28.1",
    "icalendar>=7.2.2",
]

[dependency-groups]
dev = [
    "djhtml>=3.0.11",
    "django-debug-toolbar>=7.0.0",
    "ruff>=0.16.1",
    "django-stubs>=6.0.8",
    "prek>=0.4.12",
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "wagtail-factories>=4.5.0",
]
prod = [
    "psycopg>=3.3.4",
    "granian>=2.8.1",
    "django-storages[azure]>=1.14.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "brownsea.core.settings.dev"
python_files = ["test_*.py"]
testpaths = ["brownsea"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "B",
    "BLE",
    "C4",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "I",
    "N",
    "S",
    "T10",
    "UP",
    "W",
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "B009",    # Do not call `getattr` with a constant attribute value.
    "COM812",  # Conflicts with formatter
    "N999",    # Invalid module name
    "S101",    # S101 Use of `assert` detected
]

[tool.ruff.lint.isort.sections]
# Group all Django imports into a separate section.
"django" = ["django"]
