[project]
name = "brownsea"
version = "0.1.0"
description = ""
authors = [{ name = "Dan Trickey", email = "git@trickey.io" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "wagtail>=7.3,<7.4",
    "crispy-bootstrap5>=2025.6",
    "django-crispy-forms>=2.4",
    "dj-database-url>=3.0.0",
    "django-environ>=0.12.0",
    "django-vite>=3.1.0",
    "whitenoise>=6.9.0",
    "authlib>=1.6.0",
    "sentry-sdk[django]>=2.30.0",
    "httpx>=0.28.1",
    "icalendar>=6.1.0",
]

[dependency-groups]
dev = [
    "djhtml>=3.0.8",
    "django-debug-toolbar>=5.2.0",
    "ruff>=0.11.13",
    "django-stubs>=5.2.9",
    "prek>=0.4.12",
]
prod = [
    "psycopg>=3.2.9",
    "granian>=2.3.4",
    "django-storages[azure]>=1.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "B",
    "BLE",
    "C4",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "I",
    "N",
    "S",
    "T10",
    "UP",
    "W",
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "B009",    # Do not call `getattr` with a constant attribute value.
    "COM812",  # Conflicts with formatter
    "N999",    # Invalid module name
    "S101",    # S101 Use of `assert` detected
]

[tool.ruff.lint.isort.sections]
# Group all Django imports into a separate section.
"django" = ["django"]
