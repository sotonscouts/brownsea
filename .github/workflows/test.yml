name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: .venv/
          key: ${{ runner.os }}-${{ matrix.python }}-uv-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Formatting
        run: make format-check
      - name: Django Static Checks
        run: cp .env.example .env && make check
      - name: Tests
        run: cp .env.example .env && make test
