{% load wagtailcore_tags %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
    {% for tile in value %}
        <div class="col">
            <a href="{{ tile.value.url }}" class="card task-tile h-100 text-decoration-none text-body">
                <div class="card-body d-flex align-items-center gap-3">
                    <span class="task-icon" aria-hidden="true"><i class="bi {{ tile.value.icon_class }}"></i></span>
                    <span class="fw-semibold">{{ tile.value.label }}</span>
                </div>
            </a>
        </div>
    {% endfor %}
</div>
